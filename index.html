<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="public/java-drift.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Java Drift - 3D Web Game</title>
</head>

<body>
    <div id="hud">
        <div class="title">JAVA DRIFT</div>
        <div id="speed">Kecepatan: 0 km/h</div>
        <div id="score">Total Skor: 0</div>
        <div id="drift-status"></div>
        <div class="controls">Kontrol PC: <b>W/A/S/D</b> atau <b>Panah</b> | <b>Spasi</b> untuk Drift</div>
    </div>

    <!-- Kontrol Sentuh Layar (Mobile / Tablet) -->
    <div id="touch-controls">
        <div class="touch-left">
            <button id="btn-left" class="touch-btn">◀</button>
            <button id="btn-right" class="touch-btn">▶</button>
        </div>
        <div class="touch-right">
            <button id="btn-drift" class="touch-btn drift-btn">DRIFT</button>
            <button id="btn-brake" class="touch-btn brake-btn">REM</button>
            <button id="btn-gas" class="touch-btn gas-btn">GAS</button>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
